name: Mirror mac-tracker to Gitee
on:
  schedule:
    - cron: '0 18 * * *'   # 每天一次，北京时间约 02:00
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: runZeroInc/mac-tracker
          fetch-depth: 0
      - name: Push to Gitee with timeout & retry
        env:
          GITEE_PAT: ${{ secrets.GITEE_PAT }}
        run: |
          git remote add gitee https://oauth2:${GITEE_PAT}@gitee.com/brightflight/mac-tracker.git
          git remote -v
          git -c http.timeout=60 -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=15 ls-remote gitee
          for i in {1..3}; do
            echo "Push attempt $i"
            git -c http.timeout=120 -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=30 push --prune gitee refs/heads/*:refs/heads/* refs/tags/*:refs/tags/*
            if [ $? -eq 0 ]; then
              echo "✅ Sync completed successfully"
              exit 0
            fi
            echo "⚠️ Attempt $i failed, sleep 10s before retry"
            sleep 10
          done
          echo "❌ All push attempts failed"
          exit 1