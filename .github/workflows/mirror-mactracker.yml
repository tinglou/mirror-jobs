name: Mirror mac-tracker to Gitee (HTTPS PAT)
on:
  schedule:
    - cron: '10 10 * * *'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: runZeroInc/mac-tracker
          fetch-depth: 0
      - name: Push to Gitee
        env:
          GITEE_PAT: ${{ secrets.GITEE_PAT }}
        run: |
          git remote add gitee https://hanhancat:${GITEE_PAT}@gitee.com/brightflight/mac-tracker.git
          git push --prune gitee refs/heads/*:refs/heads/* refs/tags/*:refs/tags/*