name: Mirror mac-tracker to Gitee (HTTPS PAT fixed)
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: runZeroInc/mac-tracker
          fetch-depth: 0
      - name: Debug push
        env:
          GITEE_PAT: ${{ secrets.GITEE_PAT }}
        run: |
          git remote add gitee https://oauth2:${GITEE_PAT}@gitee.com/brightflight/mac-tracker.git
          git remote -v
          git ls-remote gitee
          git push --prune gitee refs/heads/*:refs/heads/* refs/tags/*:refs/tags/*